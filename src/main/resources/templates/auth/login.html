<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Library Login</h2>

                    <div id="message"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="studentId" class="form-label">Student ID or ADMIN ID</label>
                            <input type="text" class="form-control" id="studentId" required>
                        </div>

                        <div class="mb-3">
                            <label for="pin" class="form-label">PIN</label>
                            <input type="password" class="form-control" id="pin" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const loginForm = document.getElementById("loginForm");
    const messageBox = document.getElementById("message");

    if (localStorage.getItem("token")) {
        window.location.href = [[ @{/dashboard} ]];
    }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            messageBox.innerHTML = "";

            const payload = {
                studentId: document.getElementById("studentId").value.trim(),
                pin: document.getElementById("pin").value.trim()
            };

            try {
                const response = await fetch('/api/library/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    let errorHtml = result.message
                        ? `<div>${result.message}</div>`
                        : `<div>Login failed.</div>`;

                    if (result.validationErrors) {
                        for (const field in result.validationErrors) {
                            errorHtml += `<div>${result.validationErrors[field]}</div>`;
                        }
                    }

                    messageBox.innerHTML = `
                    <div class="alert alert-danger">
                        ${errorHtml}
                    </div>
                `;
                    return;
                }

                localStorage.setItem("token", result.token);
                localStorage.setItem("studentId", result.studentId);
                localStorage.setItem("role", result.role);
                localStorage.setItem("firstLogin", result.firstLogin);

                if (result.role == "ADMIN") {
                    window.location.href = [[ @{/admin/dashboard} ]];
                } else {
                    window.location.href = [[ @{/dashboard} ]];
                }

            } catch (error) {
                    messageBox.innerHTML = `
                <div class="alert alert-danger">
                    Something went wrong. Please try again.
                </div>
            `;
                }
            });
</script>

</body>
</html>
