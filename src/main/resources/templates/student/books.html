<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Library Books</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div id="loading">Loading books...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="booksTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Total Copies</th>
                        <th>Available</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="booksBody"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const booksBody = document.getElementById("booksBody");
    const booksTable = document.getElementById("booksTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

    if (role !== "STUDENT") {
        window.location.href = [[ @{/admin/dashboard} ]];
    }

    async function fetchMyBorrowedIsbns() {
        const response = await fetch([[ @{/api/library/account/my-borrowings} ]], {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.clear();
            window.location.href = [[ @{/login} ]];
            return null;
        }

        const result = await response.json();

        if (!response.ok) {
            let errorHtml = result.message
                ? `<div>${result.message}</div>`
                : `<div>Failed to load current borrowings.</div>`;

            if (result.validationErrors) {
                for (const field in result.validationErrors) {
                    errorHtml += `<div>${result.validationErrors[field]}</div>`;
                }
            }

            messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
            return null;
        }

        return new Set(result.map(loan => loan.isbn));
    }

    async function loadBooks() {
        messageBox.innerHTML = "";
        loading.style.display = "block";
        booksTable.style.display = "none";

        try {
            const borrowedIsbns = await fetchMyBorrowedIsbns();

            if (borrowedIsbns === null) {
                loading.style.display = "none";
                return;
            }

            const response = await fetch([[ @{/api/library/books} ]], {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to load books.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                loading.style.display = "none";
                return;
            }

            booksBody.innerHTML = "";

            if (result.length === 0) {
                booksBody.innerHTML = `<tr><td colspan="8" class="text-center">No books available</td></tr>`;
            } else {
                result.forEach(book => {
                    const statusBadge = book.active
                        ? `<span class="badge bg-success">Active</span>`
                        : `<span class="badge bg-secondary">Inactive</span>`;

                    const availabilityBadge = book.availableCopies > 0
                        ? `<span class="badge bg-success">${book.availableCopies}</span>`
                        : `<span class="badge bg-danger">0</span>`;

                    const alreadyBorrowed = borrowedIsbns.has(book.isbn);

                    let actionButton = `
                        <button
                            class="btn btn-primary btn-sm"
                            onclick="borrowBook('${book.isbn}')"
                            ${(book.availableCopies === 0 || !book.active) ? 'disabled' : ''}>
                            Borrow
                        </button>
                    `;

                    if (alreadyBorrowed) {
                        actionButton = `
                            <button class="btn btn-secondary btn-sm" disabled>
                                Borrowed
                            </button>
                        `;
                    }

                    const row = `
                        <tr>
                            <td>${book.id ?? ''}</td>
                            <td>${book.isbn ?? ''}</td>
                            <td>${book.title ?? ''}</td>
                            <td>${book.author ?? ''}</td>
                            <td>${book.totalCopies ?? ''}</td>
                            <td>${availabilityBadge}</td>
                            <td>${statusBadge}</td>
                            <td>${actionButton}</td>
                        </tr>
                    `;

                    booksBody.innerHTML += row;
                });
            }

            loading.style.display = "none";
            booksTable.style.display = "table";

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
            loading.style.display = "none";
        }
    }

    async function borrowBook(isbn) {
        messageBox.innerHTML = "";

        try {
            const response = await fetch([[ @{/api/library/borrow} ]], {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ isbn: isbn })
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to borrow book.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                return;
            }

            messageBox.innerHTML = `
                <div class="alert alert-success">
                    <div><strong>Book borrowed successfully.</strong></div>
                    <div><strong>Loan ID:</strong> ${result.loanId}</div>
                    <div><strong>Title:</strong> ${result.title}</div>
                    <div><strong>ISBN:</strong> ${result.isbn}</div>
                    <div><strong>Status:</strong> ${result.status}</div>
                    <div><strong>Borrowed At:</strong> ${result.borrowedAt}</div>
                    <div><strong>Due At:</strong> ${result.dueAt}</div>
                </div>
            `;

            await loadBooks();

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = [[ @{/login} ]];
    }

    loadBooks();
</script>

</body>
</html>
