<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Borrow History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Borrow History</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div id="loading">Loading borrow history...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="historyTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Borrowed At</th>
                        <th>Due At</th>
                        <th>Returned At</th>
                    </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const historyBody = document.getElementById("historyBody");
    const historyTable = document.getElementById("historyTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

    if (role !== "STUDENT") {
        window.location.href = [[ @{/admin/dashboard} ]];
    }

    async function loadBorrowHistory() {
        messageBox.innerHTML = "";

        try {
            const response = await fetch([[ @{/api/library/account/me} ]], {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to load borrow history.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                loading.style.display = "none";
                return;
            }

            historyBody.innerHTML = "";

            if (result.length === 0) {
                historyBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No borrowing history found</td>
                    </tr>
                `;
            } else {
                result.forEach(loan => {
                    let statusBadge = `<span class="badge bg-secondary">${loan.status ?? ''}</span>`;

                    if (loan.status === "BORROWED") {
                        statusBadge = `<span class="badge bg-primary">BORROWED</span>`;
                    } else if (loan.status === "OVERDUE") {
                        statusBadge = `<span class="badge bg-danger">OVERDUE</span>`;
                    } else if (loan.status === "RETURNED") {
                        statusBadge = `<span class="badge bg-success">RETURNED</span>`;
                    }

                    const returnedAtText = loan.returnedAt ? loan.returnedAt : "-";

                    const row = `
                        <tr>
                            <td>${loan.isbn ?? ''}</td>
                            <td>${loan.title ?? ''}</td>
                            <td>${statusBadge}</td>
                            <td>${loan.borrowedAt ?? ''}</td>
                            <td>${loan.dueAt ?? ''}</td>
                            <td>${returnedAtText}</td>
                        </tr>
                    `;

                    historyBody.innerHTML += row;
                });
            }

            loading.style.display = "none";
            historyTable.style.display = "table";

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
            loading.style.display = "none";
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = [[ @{/login} ]];
    }

    loadBorrowHistory();
</script>

</body>
</html>
