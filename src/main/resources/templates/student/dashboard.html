<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Library Dashboard</h2>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4">
            <h5 class="fw-semibold mb-2">Welcome</h5>
            <p id="userInfo" class="mb-0 text-muted"></p>
        </div>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 text-center">
                <div class="card-body p-4">
                    <h5 class="fw-semibold">Browse Books</h5>
                    <p class="text-muted mb-4">Search and explore available books</p>
                    <a th:href="@{/books}" class="btn btn-primary btn-sm px-4">View Books</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 text-center">
                <div class="card-body p-4">
                    <h5 class="fw-semibold">My Borrowed Books</h5>
                    <p class="text-muted mb-4">Check currently borrowed books</p>
                    <a th:href="@{/my-borrowings}" class="btn btn-primary btn-sm px-4">View</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 text-center">
                <div class="card-body p-4">
                    <h5 class="fw-semibold">Borrow History</h5>
                    <p class="text-muted mb-4">View your past borrow records</p>
                    <a th:href="@{/borrow-history}" class="btn btn-primary btn-sm px-4">View</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "/login";
    }

    const studentId = localStorage.getItem("studentId");
    const role = localStorage.getItem("role");

    document.getElementById("userInfo").innerText =
        `Logged in as: ${studentId} (${role})`;

    function logout() {
        localStorage.clear();
        window.location.href = "/login";
    }
</script>

</body>
</html>
