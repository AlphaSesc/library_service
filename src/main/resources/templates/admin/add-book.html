<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Add Book</h2>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form id="addBookForm">

                <div class="mb-3">
                    <label for="isbn" class="form-label">ISBN (Scan or Enter)</label>
                    <input type="text" class="form-control" id="isbn" required>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">Author</label>
                    <input type="text" class="form-control" id="author" required>
                </div>

                <div class="mb-3">
                    <label for="totalCopies" class="form-label">Total Copies</label>
                    <input type="number" class="form-control" id="totalCopies" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Book</button>

            </form>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const form = document.getElementById("addBookForm");

    // Auth check
    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        if (role !== "ADMIN") {
            window.location.href = [[ @{/dashboard} ]];
        }

            // Focus ISBN (simulate scanner usability)
            document.getElementById("isbn").focus();

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                messageBox.innerHTML = "";

                const payload = {
                    isbn: document.getElementById("isbn").value.trim(),
                    title: document.getElementById("title").value.trim(),
                    author: document.getElementById("author").value.trim(),
                    totalCopies: parseInt(document.getElementById("totalCopies").value)
                };

                try {
                    const response = await fetch([[ @{/api/admin/library/books} ]], {
                        method: "POST",
                            headers: {
                            "Content-Type": "application/json",
                                "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 401 || response.status === 403) {
                        localStorage.clear();
                        window.location.href = [[ @{/login} ]];
                        return;
                    }

                        const result = await response.json();

                        if (!response.ok) {
                            let errorHtml = result.message
                                ? `<div>${result.message}</div>`
                                : `<div>Failed to add book.</div>`;

                            if (result.validationErrors) {
                                for (const field in result.validationErrors) {
                                    errorHtml += `<div>${result.validationErrors[field]}</div>`;
                                }
                            }

                            messageBox.innerHTML =
                                `<div class="alert alert-danger">${errorHtml}</div>`;
                            return;
                        }

                        // Success
                        messageBox.innerHTML = `
                <div class="alert alert-success">
                    <div><strong>Book added successfully!</strong></div>
                    <div><strong>Title:</strong> ${result.title}</div>
                    <div><strong>ISBN:</strong> ${result.isbn}</div>
                    <div><strong>Author:</strong> ${result.author}</div>
                    <div><strong>Total Copies:</strong> ${result.totalCopies}</div>
                </div>
            `;

                        form.reset();
                        document.getElementById("isbn").focus();

                    } catch (error) {
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
                    }
                });

                function logout() {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                }
</script>

</body>
</html>
