<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Current Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Current Loans</h2>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div id="loading">Loading current loans...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="loansTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Borrowed At</th>
                        <th>Due At</th>
                    </tr>
                    </thead>
                    <tbody id="loansBody"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const loansBody = document.getElementById("loansBody");
    const loansTable = document.getElementById("loansTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        if (role !== "ADMIN") {
            window.location.href = [[ @{/dashboard} ]];
        }

            async function loadLoans() {
                messageBox.innerHTML = "";

                try {
                    const response = await fetch([[ @{/api/admin/library/loans/current} ]], {
                        method: "GET",
                            headers: {
                            "Authorization": "Bearer " + token
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        localStorage.clear();
                        window.location.href = [[ @{/login} ]];
                        return;
                    }

                        const result = await response.json();

                        if (!response.ok) {
                            let errorHtml = result.message
                                ? `<div>${result.message}</div>`
                                : `<div>Failed to load current loans.</div>`;

                            if (result.validationErrors) {
                                for (const field in result.validationErrors) {
                                    errorHtml += `<div>${result.validationErrors[field]}</div>`;
                                }
                            }

                            messageBox.innerHTML =
                                `<div class="alert alert-danger">${errorHtml}</div>`;
                            loading.style.display = "none";
                            return;
                        }

                        loansBody.innerHTML = "";

                        if (result.length === 0) {
                            loansBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No current loans</td>
                    </tr>
                `;
                        } else {
                            result.forEach(loan => {

                                const statusBadge = `
                        <span class="badge bg-primary">${loan.status}</span>
                    `;

                                const row = `
                        <tr>
                            <td>${loan.studentId ?? ''}</td>
                            <td>${loan.isbn ?? ''}</td>
                            <td>${loan.title ?? ''}</td>
                            <td>${statusBadge}</td>
                            <td>${loan.borrowedAt ?? ''}</td>
                            <td>${loan.dueAt ?? ''}</td>
                        </tr>
                    `;

                                loansBody.innerHTML += row;
                            });
                        }

                        loading.style.display = "none";
                        loansTable.style.display = "table";

                    } catch (error) {
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
                        loading.style.display = "none";
                    }
                }

                function logout() {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                }

                    loadLoans();
</script>

</body>
</html>
