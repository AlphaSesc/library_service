<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Library Books</h2>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div id="loading">Loading books...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="booksTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Total Copies</th>
                        <th>Available Copies</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="booksBody"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const booksBody = document.getElementById("booksBody");
    const booksTable = document.getElementById("booksTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        if (role !== "ADMIN") {
            window.location.href = [[ @{/dashboard} ]];
        }

            async function loadBooks() {
                messageBox.innerHTML = "";

                try {
                    const response = await fetch([[ @{/api/admin/library/books} ]], {
                        method: "GET",
                            headers: {
                            "Authorization": "Bearer " + token
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        localStorage.clear();
                        window.location.href = [[ @{/login} ]];
                        return;
                    }

                        const result = await response.json();

                        if (!response.ok) {
                            let errorHtml = result.message
                                ? `<div>${result.message}</div>`
                                : `<div>Failed to load books.</div>`;

                            if (result.validationErrors) {
                                for (const field in result.validationErrors) {
                                    errorHtml += `<div>${result.validationErrors[field]}</div>`;
                                }
                            }

                            messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                            loading.style.display = "none";
                            return;
                        }

                        booksBody.innerHTML = "";

                        if (result.length === 0) {
                            booksBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No books found</td>
                    </tr>
                `;
                        } else {
                            result.forEach(book => {
                                const statusBadge = book.active
                                    ? `<span class="badge bg-success">Active</span>`
                                    : `<span class="badge bg-secondary">Inactive</span>`;

                                const availableBadge = book.availableCopies > 0
                                    ? `<span class="badge bg-success">${book.availableCopies}</span>`
                                    : `<span class="badge bg-danger">0</span>`;

                                const row = `
                        <tr>
                            <td>${book.isbn ?? ''}</td>
                            <td>${book.title ?? ''}</td>
                            <td>${book.author ?? ''}</td>
                            <td>${book.totalCopies ?? ''}</td>
                            <td>${availableBadge}</td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;

                                booksBody.innerHTML += row;
                            });
                        }

                        loading.style.display = "none";
                        booksTable.style.display = "table";

                    } catch (error) {
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
                        loading.style.display = "none";
                    }
                }

                function logout() {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                }

                    loadBooks();
</script>

</body>
</html>
