<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Students Overview</h2>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div id="loading">Loading students...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="studentsTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Books on Loan</th>
                        <th>Overdue Books</th>
                    </tr>
                    </thead>
                    <tbody id="studentsBody"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const studentsBody = document.getElementById("studentsBody");
    const studentsTable = document.getElementById("studentsTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        if (role !== "ADMIN") {
            window.location.href = [[ @{/dashboard} ]];
        }

            async function loadStudents() {
                messageBox.innerHTML = "";

                try {
                    const response = await fetch([[ @{/api/admin/library/students/loan-summary} ]], {
                        method: "GET",
                            headers: {
                            "Authorization": "Bearer " + token
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        localStorage.clear();
                        window.location.href = [[ @{/login} ]];
                        return;
                    }

                        const result = await response.json();

                        if (!response.ok) {
                            let errorHtml = result.message
                                ? `<div>${result.message}</div>`
                                : `<div>Failed to load students.</div>`;

                            if (result.validationErrors) {
                                for (const field in result.validationErrors) {
                                    errorHtml += `<div>${result.validationErrors[field]}</div>`;
                                }
                            }

                            messageBox.innerHTML =
                                `<div class="alert alert-danger">${errorHtml}</div>`;
                            loading.style.display = "none";
                            return;
                        }

                        studentsBody.innerHTML = "";

                        if (result.length === 0) {
                            studentsBody.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center">No students found</td>
                    </tr>
                `;
                        } else {
                            result.forEach(student => {

                                const overdueBadge = student.overdueBooks > 0
                                    ? `<span class="badge bg-danger">${student.overdueBooks}</span>`
                                    : `<span class="badge bg-success">0</span>`;

                                const loanBadge = student.booksOnLoan > 0
                                    ? `<span class="badge bg-primary">${student.booksOnLoan}</span>`
                                    : `<span class="badge bg-secondary">0</span>`;

                                const row = `
                        <tr>
                            <td>${student.studentId ?? ''}</td>
                            <td>${loanBadge}</td>
                            <td>${overdueBadge}</td>
                        </tr>
                    `;

                                studentsBody.innerHTML += row;
                            });
                        }

                        loading.style.display = "none";
                        studentsTable.style.display = "table";

                    } catch (error) {
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
                        loading.style.display = "none";
                    }
                }

                function logout() {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                }

                    loadStudents();
</script>

</body>
</html>
